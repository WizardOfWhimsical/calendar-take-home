<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Define the repeating tile pattern -->
    <pattern id="plus-pattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="3.5" y="1" width="1" height="6" fill="hsl(183.15deg 100% 28.15% / 28%)" />
      <rect x="1" y="3.5" width="6" height="1" fill="hsl(183.15deg 100% 28.15% / 28%)" />
    </pattern>
  </defs>

  <!-- Fill a rectangle with the pattern -->
  <rect width="100%" height="100%" fill="url(#plus-pattern)" />
</svg>
